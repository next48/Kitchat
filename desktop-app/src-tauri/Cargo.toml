[package]
name = "oliver-kitchen-desktop"
version = "1.4.92"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oliver_kitchen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-system-audio = { git = "https://github.com/Subcue/tauri-plugin-system-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
webrtc = "0.17"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
xcap = "0.9.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
rdev = "0.5"
windows-capture = "2.0.1"
nvenc = "0.1.0"
openh264 = { version = "0.9.8", features = ["source"] }
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D11", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
flexaudio-core = "0.2.0"
flexaudio-os-windows = "0.2.0"
sysinfo = "0.37"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"



