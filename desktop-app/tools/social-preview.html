<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchat — social preview</title><div id="app"></div><script type="module">
import '/src/styles.css'; import '/src/social.css';
import {friendsView,friendRows,selectFriends} from '/src/social-ui.ts';
const people=[{id:42,name:'Анастасия',online:true,friend_status:1},{id:108,name:'Михаил',online:true,friend_status:1},{id:76,name:'Полина',online:true,friend_status:1},{id:215,name:'Александр',online:false,friend_status:1},{id:301,name:'Даниил',online:false,friend_status:1},{id:85,name:'Мария',online:true,friend_status:0,sent_by_me:false},{id:91,name:'Илья',online:false,friend_status:0,sent_by_me:true}];
let filter='all',query=''; const avatar=p=>p.name[0];
document.querySelector('#app').innerHTML=`<main class="app-shell no-server"><nav class="rail"><button class="home active-home"><img src="/kitchat-icon.png"></button><i></i><button class="server">K</button><button class="server">✦</button><button class="add">+</button></nav><aside class="channels"><header><div><small>KITCHAT</small><b>Главная</b></div></header><div class="channel-scroll"><button class="home-nav-friends active"><span><b>Друзья</b><small>3 сейчас в сети</small></span></button><button class="home-nav-friends"><span><b>Заявки в друзья</b><small>1 новая</small></span></button><section class="dm-sidebar-card"><div class="section dm-title"><span>ЛИЧНЫЕ СООБЩЕНИЯ</span><button>+</button></div>${people.slice(0,3).map(p=>`<button class="dm-thread"><div class="avatar">${avatar(p)}<i></i></div><span><b>${p.name}</b><small>Увидимся вечером!</small></span></button>`).join('')}</section></div><section class="profile"><div class="avatar">О<i></i></div><div><b>Оливер</b><small>В сети</small></div><button>⚙</button></section></aside><section class="chat">${friendsView(people,filter,avatar)}</section><aside class="members"><header><div><b>В сети — 3</b></div></header><div class="members-list">${people.slice(0,3).map(p=>`<div class="member online"><div class="avatar">${avatar(p)}<i></i></div><div><b>${p.name}</b><small>В сети</small></div></div>`).join('')}</div></aside><div class="titlebar"><span>Kitchat</span><div><button>—</button><button>□</button><button>×</button></div></div></main>`;
document.querySelector('.social-footer b').textContent='24';
function paint(){document.querySelector('.home-friends-list').innerHTML=friendRows(people,filter,query,avatar);document.querySelectorAll('[data-friends-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.friendsFilter===filter);b.setAttribute('aria-selected',b.dataset.friendsFilter===filter)});document.querySelector('#friendsListCount').textContent=selectFriends(people,filter,query).length+' в списке';}
document.querySelector('#friendsFilter').oninput=e=>{query=e.target.value;paint()};
document.querySelector('.social-hub').onclick=e=>{const b=e.target.closest('[data-friends-filter]');if(b){filter=b.dataset.friendsFilter;paint()}};
</script></html>
