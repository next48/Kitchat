name: KitChat iPhone and iPad for SideStore
on:
  workflow_dispatch:
  push:
    branches: [mobile-ios]
concurrency:
  group: kitchat-ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  server-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP changes
        run: |
          php -l desktop-app/server-update/api/direct_messages.php
          php -l desktop-app/server-update/api/call_signal.php
      - uses: actions/upload-artifact@v4
        with:
          name: KitChat-server-update
          path: desktop-app/server-update/
  ipa:
    needs: server-checks
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri
      - name: Install tools and dependencies
        run: |
          rustup target add aarch64-apple-ios
          command -v xcodegen || brew install xcodegen
          npm ci
      - name: Validate frontend
        run: npm run build
      - name: Build device archive
        run: |
          npm run tauri -- ios init --ci --skip-targets-install
          node tools/prepare-ios-icons.mjs
          npm run tauri -- ios build --target aarch64 --no-sign --archive-only --ci
      - name: Package SideStore IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src-tauri -type d -path '*.xcarchive/Products/Applications/*.app' -print -quit)"
          test -n "$app"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$app/Info.plist"
          mkdir -p Payload
          ditto "$app" "Payload/$(basename "$app")"
          ditto -c -k --keepParent Payload KitChat-SideStore.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: KitChat-iPhone-iPad-SideStore
          path: desktop-app/KitChat-SideStore.ipa
          if-no-files-found: error
          retention-days: 14
