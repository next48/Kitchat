name: Build Kitchat for macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "kitchat-v*"

permissions:
  contents: write

concurrency:
  group: kitchat-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop-app
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      # Without an Apple certificate, ad-hoc signing prevents downloaded ARM
      # builds from being reported as a damaged application by macOS.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-app/src-tauri/target
          key: macos-tauri-${{ runner.arch }}-${{ hashFiles('desktop-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            macos-tauri-${{ runner.arch }}-

      - name: Check updater signing secrets
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is missing"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing"; exit 1; }

      - name: Import Apple signing certificate
        if: env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/kitchat-developer-id.p12"
          keychain="$RUNNER_TEMP/kitchat-build.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k actions "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build DMG and updater bundle
        run: npm run tauri -- build --bundles app,dmg

      - name: Collect release files
        id: release_files
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          output="$RUNNER_TEMP/kitchat-macos"
          mkdir -p "$output"
          find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -exec cp '{}' "$output/" \;
          test -n "$(find "$output" -maxdepth 1 -name '*.dmg' -print -quit)" || { echo "DMG was not created"; exit 1; }
          archive="$(find "$output" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          test -n "$archive" || { echo "Updater archive was not created"; exit 1; }
          test -f "$archive.sig" || { echo "Updater signature was not created"; exit 1; }
          architecture="$(uname -m)"
          (cd "$output" && shasum -a 256 * > "SHA256SUMS-${architecture}.txt")
          if [[ "$architecture" == "arm64" ]]; then updater_target="darwin-aarch64"; else updater_target="darwin-x86_64"; fi
          archive_name="$(basename "$archive")"
          signature="$(cat "$archive.sig")"
          release_tag="$GITHUB_REF_NAME"
          node - "$output/macos-updater-platform.json" "$updater_target" "$signature" "$archive_name" "$release_tag" <<'NODE'
          const fs = require('fs');
          const [file, target, signature, archive, tag] = process.argv.slice(2);
          const value = {
            [target]: {
              signature,
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/${archive}`
            }
          };
          fs.writeFileSync(file, JSON.stringify(value, null, 2));
          NODE
          echo "directory=$output" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitchat-macos-${{ matrix.arch }}
          path: ${{ steps.release_files.outputs.directory }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing keychain
        if: always() && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/kitchat-build.keychain-db" || true

  publish-macos:
    name: Publish macOS release
    if: startsWith(github.ref, 'refs/tags/kitchat-v')
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download both architectures
        uses: actions/download-artifact@v4
        with:
          pattern: kitchat-macos-*
          path: artifacts

      - name: Merge updater platform metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const files = [];
          for (const directory of fs.readdirSync('artifacts')) {
            const file = path.join('artifacts', directory, 'macos-updater-platform.json');
            if (fs.existsSync(file)) files.push(file);
          }
          if (files.length !== 2) throw new Error(`Expected two updater manifests, found ${files.length}`);
          const merged = Object.assign({}, ...files.map(file => JSON.parse(fs.readFileSync(file, 'utf8'))));
          if (!merged['darwin-aarch64'] || !merged['darwin-x86_64']) throw new Error('Both macOS architectures are required');
          fs.writeFileSync('artifacts/macos-updater-platform.json', JSON.stringify(merged, null, 2));
          NODE

      - name: Publish files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Kitchat ${GITHUB_REF_NAME#kitchat-v}" --generate-notes
          fi
          find artifacts -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name 'SHA256SUMS-*.txt' \) -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
          gh release upload "$GITHUB_REF_NAME" artifacts/macos-updater-platform.json --clobber
